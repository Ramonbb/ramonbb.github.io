<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selected references used in research on tourism, marketing, text mining, and topic modeling.">
  <title>References - Academic Research Portal Ramón Barrera-Barrera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="projects">
  <header class="site-header">
    <nav class="navbar container" aria-label="Primary navigation" data-i18n-aria-label="aria.primaryNavigation">
      <a class="brand" href="index.html" aria-label="Academic Research Portal home" data-i18n-aria-label="aria.portalHome"><span class="brand-mark">RB</span><span data-i18n="brand.name">Academic Research Portal</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="publications.html" data-i18n="nav.publications">Publications</a></li>
        <li><a href="appendices.html" data-i18n="nav.researchResources">Research Resources</a></li>
        <li><a class="active" href="projects.html" data-i18n="nav.projects">References</a></li>
      </ul>
      <div class="nav-actions">
        <div class="language-selector" role="group" aria-label="Language selector" data-i18n-aria-label="aria.languageSelector">
          <button class="language-button active" type="button" data-language="en" aria-label="Switch to English" data-i18n-aria-label="aria.switchEnglish" aria-pressed="true">EN</button>
          <button class="language-button" type="button" data-language="es" aria-label="Switch to Spanish" data-i18n-aria-label="aria.switchSpanish" aria-pressed="false">ES</button>
        </div>
        <button class="nav-toggle" type="button" aria-label="Open navigation menu" data-i18n-aria-label="aria.openMenu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="references.title">References</h1>
      </div>
    </section>

    <section class="section references-section">
      <div class="container">
        <div class="publication-controls reference-controls">
          <div class="filter-toolbar" aria-label="Reference filters" data-i18n-aria-label="aria.referenceFilters">
            <button class="filter-button active" data-reference-filter="all" type="button" data-i18n="filters.all">All</button>
            <button class="filter-button" data-reference-filter="tourism" type="button" data-i18n="filters.tourism">Tourism</button>
            <button class="filter-button" data-reference-filter="marketing" type="button" data-i18n="filters.marketing">Marketing</button>
            <button class="filter-button" data-reference-filter="service-quality" type="button" data-i18n="filters.serviceQuality">Service Quality</button>
            <button class="filter-button" data-reference-filter="text-mining" type="button" data-i18n="filters.textMining">Text Mining</button>
            <button class="filter-button" data-reference-filter="topic-modeling" type="button" data-i18n="filters.topicModeling">Topic Modeling</button>
            <button class="filter-button" data-reference-filter="methodology" type="button" data-i18n="filters.methodology">Methodology</button>
          </div>
        </div>

        <div class="resource-list reference-list" id="reference-list"></div>
        <div class="empty-state" id="references-empty" hidden>
          <h2 data-i18n="references.emptyTitle">References will be added soon</h2>
          <p data-i18n="references.emptyText">This section will include selected bibliographic references and links to official sources.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span id="current-year"></span> Ramón Barrera-Barrera. <span data-i18n="footer.rights">All rights reserved.</span></p>
      <div class="footer-links"><a href="#">GitHub</a><a href="#">Google Scholar</a><a href="#">ORCID</a></div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
